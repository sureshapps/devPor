  <script>
  const button = document.querySelector(".holo-button");
  const scanLine = document.querySelector(".scan-line");
  const buttonText = document.querySelector(".button-text");

  let holdTimeout;
  let isHolding = false;

  button.addEventListener("mousedown", startHold);
  button.addEventListener("touchstart", startHold);

  button.addEventListener("mouseup", cancelHold);
  button.addEventListener("mouseleave", cancelHold);
  button.addEventListener("touchend", cancelHold);
  button.addEventListener("touchcancel", cancelHold);

  function startHold(e) {
    e.preventDefault();
    if (isHolding) return;
    isHolding = true;

    // Start scanning animation
    scanLine.classList.add("active");
    buttonText.textContent = "SCANNING...";

    // After 2s → change text and redirect
    holdTimeout = setTimeout(() => {
      buttonText.textContent = "LAUNCHED";
      setTimeout(() => {
        window.location.href = "https://dev.suresh.app";
      }, 500); // small delay before redirect
    }, 2000);
  }

  function cancelHold() {
    if (!isHolding) return;
    isHolding = false;

    // Cancel redirect
    clearTimeout(holdTimeout);

    // Reset button
    scanLine.classList.remove("active");
    buttonText.textContent = "LAUNCH";
  }
</script>
